<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Online Examination</title>

    <link rel="stylesheet"
          href="css/examination.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="exam-header">

        <div class="exam-title">
            <h1>Online Examination</h1>
            <p>Assessment System</p>
        </div>

        <div class="student-info">
            <p>
                <strong>Roll No:</strong> 2024CSE001
            </p>

            <div class="timer">
                Time Left:
                <span>59:45</span>
            </div>
        </div>

    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="exam-container">

        <!-- Question Area -->

        <section class="question-section">

            <div class="question-header">

                <h2>Question 1</h2>

                <span class="question-type">
                    MCQ
                </span>

            </div>


            <div class="question">

                <p class="question-text">
                    Which of the following is a programming
                    language?
                </p>


                <!-- Options -->

                <div class="options">

                    <label class="option">

                        <input type="radio"
                               name="question1">

                        <span>HTML</span>

                    </label>


                    <label class="option">

                        <input type="radio"
                               name="question1">

                        <span>CSS</span>

                    </label>


                    <label class="option">

                        <input type="radio"
                               name="question1">

                        <span>Java</span>

                    </label>


                    <label class="option">

                        <input type="radio"
                               name="question1">

                        <span>SQL</span>

                    </label>

                </div>

            </div>


            <!-- Navigation -->

            <div class="navigation">

                <button class="previous-btn">
                    ← Previous
                </button>

                <button class="next-btn">
                    Next →
                </button>

            </div>

        </section>


        <!-- ================= QUESTION NAVIGATION ================= -->

        <aside class="question-panel">

            <h3>Questions</h3>

            <p class="panel-info">
                Answered: 0 / 10
            </p>


            <div class="question-numbers">

                <button class="question-number active">
                    1
                </button>

                <button class="question-number">
                    2
                </button>

                <button class="question-number">
                    3
                </button>

                <button class="question-number">
                    4
                </button>

                <button class="question-number">
                    5
                </button>

                <button class="question-number">
                    6
                </button>

                <button class="question-number">
                    7
                </button>

                <button class="question-number">
                    8
                </button>

                <button class="question-number">
                    9
                </button>

                <button class="question-number">
                    10
                </button>

            </div>


            <!-- Submit -->

            <button class="submit-btn">
                Submit Exam
            </button>

        </aside>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            Online Examination and Assessment System
        </p>

    </footer>

</body>

</html>
