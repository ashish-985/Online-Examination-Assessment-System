<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Examination</title>
<link rel="stylesheet" href="css/examination.css">
<script src="js/exam.js" defer></script>
</head>
<body>
<header class="exam-header">
<div><h1>Online Examination</h1><p>Computer Fundamentals</p></div>
<div class="student"><strong id="studentLabel">Roll No: Guest</strong><span class="timer" id="timer">Time Left: 30:00</span></div>
</header>
<main class="exam-layout">
<section class="question-card">
<div class="question-head"><h2 id="questionHeading">Question 1</h2><span>MCQ</span></div>
<p class="question" id="questionText">Loading question...</p>
<div id="optionsContainer"></div>
<div class="navigation">
<button type="button" id="previousButton">← Previous</button>
<button type="button" id="nextButton">Next →</button>
</div>
</section>
<aside class="question-panel">
<h3>Questions</h3>
<p id="answeredCount">Answered: 0 / 20</p>
<div class="numbers" id="questionNumbers"></div>
<button type="button" class="submit" id="submitExam" style="width:100%;border:0;cursor:pointer;font:inherit;">Submit Exam</button>
</aside>
</main>
</body>
</html>
