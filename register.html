<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="css/auth.css">
<script src="js/auth.js" defer></script>
</head>
<body>
<main class="auth-container">
<section class="auth-card">
<div class="logo">📝<h1>Online Examination</h1><p>Assessment System</p></div>
<h2>Create Account</h2>
<p class="subtitle">Register to start your examination journey.</p>
<form id="registerForm">
<label>Full Name<input id="fullName" type="text" placeholder="Enter your full name" required></label>
<label>University Roll Number<input id="rollNumber" type="text" placeholder="Enter your roll number" required></label>
<label>Email Address<input id="email" type="email" placeholder="Enter your email" required></label>
<label>Password<input id="password" type="password" placeholder="Create a password (minimum 6 characters)" required></label>
<label>Confirm Password<input id="confirmPassword" type="password" placeholder="Confirm your password" required></label>
<button type="submit">Create Account</button>
</form>
<p class="switch">Already have an account? <a href="login.html">Login</a></p>
</section>
</main>
</body>
</html>
