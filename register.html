<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Online Examination System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <div class="logo">

                <div class="logo-icon">📝</div>

                <h1>Online Examination</h1>

                <p>Assessment System</p>

            </div>


            <!-- Register Heading -->
            <h2>Create Account</h2>

            <p class="subtitle">
                Register to start your examination journey
            </p>


            <form>

                <!-- Full Name -->
                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- University Roll Number -->
                <div class="input-group">

                    <label for="roll-number">
                        University Roll Number
                    </label>

                    <input
                        type="text"
                        id="roll-number"
                        name="roll-number"
                        placeholder="Enter your university roll number"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="input-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="auth-button">

                    Create Account

                </button>

            </form>


            <!-- Login Link -->
            <p class="switch-page">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>
</html>
