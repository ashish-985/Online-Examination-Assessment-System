<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examination Result</title>
<link rel="stylesheet" href="css/results.css">
<script src="js/results.js" defer></script>
</head>
<body>
<header><nav class="navbar"><a href="index.html" class="logo">Online Exam</a><a href="index.html" class="btn small-btn">Home</a></nav></header>
<main class="result-container">
<section class="result-card">
<p class="eyebrow">EXAMINATION RESULT</p>
<h1 id="examName">Computer Fundamentals</h1>
<p class="student-name" id="studentName">Your result will appear here.</p>
<div class="score-box"><span class="score" id="score">-- / 20</span><span class="percentage" id="percentage">--%</span></div>
<div class="result-grid">
<div><span>Correct Answers</span><strong id="correctAnswers">--</strong></div>
<div><span>Wrong Answers</span><strong id="wrongAnswers">--</strong></div>
<div><span>Time Taken</span><strong id="timeTaken">--</strong></div>
<div><span>Status</span><strong id="status">--</strong></div>
</div>
<div class="action-row"><a href="index.html" class="btn secondary">Back to Home</a><a href="examination.html" class="btn">Retake Exam</a></div>
</section>
</main>
<footer><p>Online Examination and Assessment System</p></footer>
</body>
</html>
