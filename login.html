<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Online Examination System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo / Project Name -->
            <div class="logo">
                <div class="logo-icon">📝</div>

                <h1>Online Examination</h1>

                <p>Assessment System</p>
            </div>

            <!-- Login Heading -->
            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to continue to your examination
            </p>

            <form>

                <!-- University Roll Number -->
                <div class="input-group">

                    <label for="roll-number">
                        University Roll Number
                    </label>

                    <input
                        type="text"
                        id="roll-number"
                        name="roll-number"
                        placeholder="Enter your university roll number"
                        required
                    >

                </div>

                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <!-- Remember Me -->
                <div class="form-options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#" class="forgot">
                        Forgot Password?
                    </a>

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="auth-button">
                    Login
                </button>

            </form>

            <!-- Register Link -->
            <p class="switch-page">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </div>

</body>
</html>
